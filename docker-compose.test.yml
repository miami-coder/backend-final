services:
  postgres-test:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: piyachok_test
      POSTGRES_PASSWORD: piyachok_test
      POSTGRES_DB: piyachok_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
