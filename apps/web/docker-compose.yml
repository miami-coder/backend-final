services:
  frontend:
    build: .
    ports:
      - '3001:3001'
    volumes:
      # Вихідники з хоста → правки підхоплює hot-reload без перезбірки образу
      - .:/app
      # Власні node_modules і .next контейнера — щоб не конфліктувати з хостовими
      - node_modules:/app/node_modules
      - next_dev_cache:/app/.next
    environment:
      # Бекенд на хості (3000); за потреби перевизначте: BACKEND_URL=http://... docker compose up
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}
      NEXT_TELEMETRY_DISABLED: '1'
    extra_hosts:
      # Для Linux: домен host.docker.internal указує на хост
      - 'host.docker.internal:host-gateway'

volumes:
  node_modules:
  next_dev_cache: